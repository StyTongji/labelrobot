[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "labelrobot"
version = "0.1.0"
description = "Local trajectory annotation for LeRobot datasets"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pyarrow>=15",
  "numpy>=1.26",
  "scipy>=1.12",
  "torch>=2.2",
  "Pillow>=10",
  "lerobot>=0.3.3,<0.5",
]

[project.optional-dependencies]
test = ["httpx>=0.27", "pytest>=8"]

[project.scripts]
labelrobot = "labelrobot.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
labelrobot = ["assets/*.json", "static/**/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
